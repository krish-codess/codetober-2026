[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bakeoff"
version = "0.1.0"
description = "The Compression Bake-Off: one dataset, every format and codec, measured in bytes read and dollars"
requires-python = ">=3.11"
# Pinned exactly: the published numbers are only reproducible against these reader/writer versions.
dependencies = [
  "pyarrow==24.0.0",
  "duckdb==1.5.6",
  "polars==2.0.0",
  "fsspec==2026.9.0",
  "numpy==2.4.6",
  "tzdata==2026.5",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10", "mypy==2.4.0"]

[project.scripts]
bakeoff = "bakeoff.cli:main"

[tool.setuptools]
packages = ["bakeoff"]

[tool.setuptools.package-data]
bakeoff = ["*.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S608"]

[tool.mypy]
files = ["bakeoff"]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
warn_return_any = false
# Platform branches (Windows page-cache calls, POSIX fadvise) need ignores that are unused on the other OS.
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # assertions read better on one line
