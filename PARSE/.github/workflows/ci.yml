name: ci
on:
  push:
  pull_request:

# Every job must pass; protect `main` with "require status checks" so a red build blocks merge.
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parse_owner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: parse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parse_owner -d parse_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://parse_owner:ci-only@127.0.0.1:5432/parse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Unit, integration, API, data and model tests (real PostgreSQL)
        run: pytest -q
      - name: API reference is in sync with the code
        run: python -m parse_app.apidoc --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint + type check
        run: npm run lint && npm run typecheck
      - name: Component tests
        run: npm test
      - name: Build
        run: npm run build

  images-and-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Build images and bring the whole stack up (synthetic seed, offline embedder)
        run: docker compose up --build -d --wait
        env:
          SEED_SOURCE: synthetic
          EMBED_BACKEND: hash
          GIT_SHA: ${{ github.sha }}
      - name: Verify from outside
        run: ./scripts/smoke.sh http://127.0.0.1:8141
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: End-to-end test of the labelling journey
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npm run e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8141
          E2E_TOKEN: change-me-annotator-token
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
