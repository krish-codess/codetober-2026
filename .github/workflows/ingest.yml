name: ingest

# GitHub only runs workflows from the repository root, so this lives here and is scoped by path.
on:
  push:
    paths: ["INGEST/**", ".github/workflows/ingest.yml"]
  pull_request:
    paths: ["INGEST/**", ".github/workflows/ingest.yml"]

defaults:
  run:
    working-directory: INGEST

jobs:
  backend:
    runs-on: ubuntu-latest
    # Real dependencies, not mocks: the integration tests migrate this PostGIS and talk to this Kafka.
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ghost_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      kafka:
        image: apache/kafka:4.1.2
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports: ["9092:9092"]
    env:
      GHOST_TEST_DSN: postgresql://postgres:ci@127.0.0.1:5432/ghost_test
      GHOST_TEST_KAFKA: 127.0.0.1:9092
      # A missing dependency fails the build instead of quietly skipping the tests that need it.
      GHOST_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: INGEST/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: API reference and dashboard are generated from code and committed
        run: |
          python -m ghostfleet openapi /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json
          python ops/make_dashboard.py
          git diff --exit-code -- ops/grafana/dashboards
      - name: Unit, integration (PostGIS + Kafka), API and failure-injection tests
        run: pytest -ra

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: INGEST/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: INGEST/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The primary user journey in a real browser, against the real API over a seeded PostGIS.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ghost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      GHOST_DSN: postgresql://postgres:ci@127.0.0.1:5432/ghost
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: INGEST/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: INGEST/web/package-lock.json
      - run: pip install -e .
      - name: Migrate and seed (simulated history straight into PostGIS, then one detector pass)
        run: |
          python -m ghostfleet migrate
          python -m ghostfleet seed-db --ships 1200 --hours 6
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: INGEST/web
      - run: npm run e2e
        working-directory: INGEST/web
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results
          path: INGEST/web/test-results

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build -t ghostfleet:ci .
      - name: The image runs, as a non-root user, without build tooling
        run: |
          docker run --rm ghostfleet:ci --help > /dev/null
          test "$(docker run --rm --entrypoint id ghostfleet:ci -u)" = "10001"
          ! docker run --rm --entrypoint sh ghostfleet:ci -c "command -v node || command -v gcc"
      - name: Alert rules and scrape config are valid
        run: >
          docker run --rm -v "$PWD/ops:/ops" --entrypoint promtool prom/prometheus:v3.5.0
          check config /ops/prometheus.yml
