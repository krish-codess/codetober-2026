name: infer

# GitHub only runs workflows from the repository root, so this lives here and is scoped by path.
on:
  push:
    paths: ["INFER/**", ".github/workflows/infer.yml"]
  pull_request:
    paths: ["INFER/**", ".github/workflows/infer.yml"]

defaults:
  run:
    working-directory: INFER

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Integration tests create and drop their own database with this; nothing is mocked.
      UPLIFT_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: INFER/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: API reference is generated from the code and committed
        run: |
          python -m uplift openapi /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json
      # Includes the differential tests against EconML, the property tests, and the model regression gate.
      - run: pytest -ra

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: INFER/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: INFER/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The whole system from a clean clone with the documented command, then checked from outside over
  # HTTP, driven through a browser, and rolled back.
  stack:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - name: Configuration from the documented example
        run: |
          python3 - <<'EOF'
          import re, secrets
          text = open(".env.example").read()
          text = re.sub("CHANGE_ME", lambda _: "ci-" + secrets.token_hex(16), text)
          text = text.replace("UPLIFT_SEED_UNITS=200000", "UPLIFT_SEED_UNITS=60000")
          open(".env", "w").write(text)
          EOF
          echo "UPLIFT_CODE_VERSION=${GITHUB_SHA::7}" >> .env
      - run: docker compose up --build --wait --wait-timeout 1500
      - name: Verify from outside
        run: |
          read_token=$(grep '^UPLIFT_READ_TOKEN=' .env | cut -d= -f2)
          admin_token=$(grep '^UPLIFT_ADMIN_TOKEN=' .env | cut -d= -f2)
          echo "UPLIFT_E2E_TOKEN=$admin_token" >> "$GITHUB_ENV"
          echo "READ_TOKEN=$read_token" >> "$GITHUB_ENV"
          bash scripts/verify.sh http://localhost:8080 "$read_token" "$admin_token"
      - name: Batch policy export
        run: |
          docker compose run --rm -T batch policy --dataset synthetic --budget 2000 --cost 1 --value 20 --out /data/export/policy.csv
          test "$(docker compose run --rm -T --entrypoint sh batch -c 'wc -l < /data/export/policy.csv')" -eq 2001
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: INFER/web/package-lock.json
      - name: End to end through a browser, desktop and phone
        working-directory: INFER/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          UPLIFT_E2E_BASE_URL=http://localhost:8080 npx playwright test
      - name: Rollback drill
        run: bash scripts/rollback-drill.sh http://localhost:8080 "$READ_TOKEN" "$UPLIFT_E2E_TOKEN"
      - if: failure()
        run: docker compose logs --no-color | tail -200
