name: measure

# GitHub only runs workflows from the repository root, so this lives here and is scoped by path.
on:
  push:
    paths: ["MEASURE/**", ".github/workflows/measure.yml"]
  pull_request:
    paths: ["MEASURE/**", ".github/workflows/measure.yml"]

defaults:
  run:
    working-directory: MEASURE

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Integration tests create and drop their own database with this; nothing is mocked.
      WRAPPED_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MEASURE/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: API reference is generated from the code and committed
        run: |
          python -m wrapped openapi /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json
      - run: pytest -ra

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MEASURE/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MEASURE/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The whole system from a clean clone with the documented command, then checked from outside over
  # HTTP, driven through a browser, and rolled back and forward.
  stack:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - name: Configuration from the documented example
        run: |
          sed "s/CHANGE_ME/ci-$(openssl rand -hex 16)/" .env.example > .env
          echo "WRAPPED_SEED_USERS=3000" >> .env
      - run: docker compose up --build --wait --wait-timeout 900
      - name: Verify from outside
        run: |
          token=$(docker compose run --rm -T batch links --per-tier 1 | head -1 | sed 's/.*#t=//')
          admin=$(grep '^WRAPPED_ADMIN_TOKEN=' .env | cut -d= -f2)
          echo "WRAPPED_E2E_TOKEN=$token" >> "$GITHUB_ENV"
          bash scripts/verify.sh http://localhost:8080 "$token" "$admin"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MEASURE/web/package-lock.json
      - name: End to end through a browser, desktop and phone
        working-directory: MEASURE/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          WRAPPED_E2E_BASE_URL=http://localhost:8080 npx playwright test
      - name: Rollback drill
        run: bash scripts/rollback-drill.sh
      - if: failure()
        run: docker compose logs --no-color | tail -200
