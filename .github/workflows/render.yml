name: render

# GitHub only runs workflows from the repository root, so this lives here and is scoped by path.
on:
  push:
    paths: ["RENDER/**", ".github/workflows/render.yml"]
  pull_request:
    paths: ["RENDER/**", ".github/workflows/render.yml"]
  # Manual: the batch projection job on the real dataset, then deploy the static site to Pages.
  workflow_dispatch:
    inputs:
      source:
        description: "auto (real data, generator if unreachable), glove-twitter-50, or synth"
        default: auto
      synth_rows:
        description: "rows when the generator is used"
        default: "1000000"

defaults:
  run:
    working-directory: RENDER

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RENDER/pyproject.toml
      - run: pip install -e ".[ml,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: API reference is generated from the code and committed
        run: |
          python -m dots openapi /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json
      # Runs the whole pipeline on seeded data (including a UMAP fit), the property tests for the
      # tiling, the API tests, the evaluation regression gate, and checks that the fixture the
      # web tests compare against is exactly what this code generates.
      - run: pytest -ra

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RENDER/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RENDER/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The primary journey in a real browser, against the same static files a CDN would serve.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      DOTS_DATA_DIR: /tmp/dots
      DOTS_SOURCE: synth
      DOTS_SYNTH_ROWS: "30000"
      DOTS_LANDMARKS: "6000"
      DOTS_TILE_CAPACITY: "2048"
      DOTS_EVAL_QUERIES: "500"
      DOTS_VARIANTS: pca,umap-n15-d0.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RENDER/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RENDER/web/package-lock.json
      - run: pip install -e ".[ml]"
      - run: python -m dots all
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: RENDER/web
      - run: npm run e2e
        working-directory: RENDER/web
      - name: The assembled static site passes the outside-in check and survives a rollback
        run: |
          python -m dots publish /tmp/site
          python -m http.server 8090 --directory /tmp/site >/dev/null 2>&1 &
          sleep 2
          python -m dots verify http://127.0.0.1:8090
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: RENDER/web/test-results

  # Batch projection job + deploy. Manual, because fitting and placing a million rows takes about
  # an hour on a hosted runner. Intermediates are cached by their inputs, so a redeploy that only
  # changes the page reuses the projections.
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, web, e2e]
    timeout-minutes: 240
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: render-pages
      cancel-in-progress: false
    env:
      DOTS_DATA_DIR: /tmp/dots
      DOTS_SOURCE: ${{ inputs.source }}
      DOTS_SYNTH_ROWS: ${{ inputs.synth_rows }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RENDER/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RENDER/web/package-lock.json
      - uses: actions/cache@v5
        with:
          path: /tmp/dots
          key: render-data-${{ inputs.source }}-${{ inputs.synth_rows }}-${{ hashFiles('RENDER/dots/fetch.py', 'RENDER/dots/ingest.py', 'RENDER/dots/project.py') }}
      - run: pip install -e ".[ml]"
      - run: python -m dots all
      - run: npm ci && npm run build
        working-directory: RENDER/web
      - run: python -m dots publish /tmp/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/site
      - id: pages
        uses: actions/deploy-pages@v4
      - name: Verify the deployment from outside
        run: python -m dots verify "${{ steps.pages.outputs.page_url }}"
