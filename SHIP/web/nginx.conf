server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  # The controller is resolved per request, so the UI still starts (and says so) when the controller is down.
  location /api/ {
    resolver ${RESOLVER} valid=10s;
    set $shipd ${SHIPD_URL};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $shipd;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 900s;  # verification scans a whole table
  }
}
