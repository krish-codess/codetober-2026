[project]
name = "dots"
version = "0.1.0"
description = "A Million Dots: projection, tiling and reference API for a GPU embedding explorer"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pyarrow>=17",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Only the batch projection job needs these; the API image does not carry them.
ml = ["umap-learn>=0.5.7", "scikit-learn>=1.5"]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dots"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S608"]
# Line length is the formatter's job; what it leaves long (strings, comments) is left long.
ignore = ["E501"]

[tool.mypy]
packages = ["dots"]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
