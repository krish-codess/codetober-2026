# The edge: static assets from disk, the JSON API forwarded to the origin with a request id.

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'none'" always;

    # Hashed filenames: the content behind a URL never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell must always be fresh so a new deploy is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # /metrics is deliberately not forwarded: it is for the operator's network, not the public edge.
    location ~ ^/(v1/|healthz$|readyz$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
