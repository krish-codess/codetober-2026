[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift"
version = "0.1.0"
description = "Who actually needed the discount: uplift meta-learners on randomized experiments, Qini evaluation, budgeted targeting policy"
requires-python = ">=3.11"
# Pinned exactly: the committed measurements and the model regression gate are only reproducible against these.
dependencies = [
  "econml==0.17.0",
  "scikit-learn==1.9.1",
  "numpy==2.4.6",
  "pandas==3.0.6",
  "scipy==1.17.1",
  "joblib==1.6.0",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "psycopg[binary,pool]==3.3.6",
  "alembic==1.20.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.168.5", "httpx==0.28.1", "ruff==0.16.10", "mypy==2.4.0"]

[project.scripts]
uplift = "uplift.cli:main"

[tool.setuptools]
packages = ["uplift"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S608"]
"migrations/*" = ["E501"]
"scripts/*" = ["E501", "S608"]
# Long SQL statements and user-facing messages read better on one line.
"uplift/ingest.py" = ["E501"]
"uplift/train.py" = ["E501"]
"uplift/api.py" = ["E501"]
"uplift/policy.py" = ["E501"]
"uplift/cli.py" = ["E501"]

[tool.mypy]
files = ["uplift"]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a real PostgreSQL (UPLIFT_TEST_ADMIN_URL)"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
