server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # Same-origin API: the static bundle calls /api/*, nginx forwards to the API container.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # Hashed assets are immutable; index.html must always revalidate so deploys take effect.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
