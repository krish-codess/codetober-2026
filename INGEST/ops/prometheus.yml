global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [alerts.yml]

scrape_configs:
  - job_name: collector
    static_configs: [{ targets: ["collector:9100"] }]
  - job_name: sink
    static_configs: [{ targets: ["sink:9100"] }]
  - job_name: detector
    static_configs: [{ targets: ["detector:9100"] }]
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
