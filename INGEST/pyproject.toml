[project]
name = "ghostfleet"
version = "0.1.0"
description = "Real-time AIS ingestion that separates receiver coverage holes from vessels that went dark"
requires-python = ">=3.11"
dependencies = [
  "aiokafka>=0.11",
  "asyncpg>=0.29",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ghostfleet = "ghostfleet.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghostfleet"]

[tool.setuptools.package-data]
ghostfleet = ["migrations/*.sql", "data/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
# S101: asserts are how tests and self-checks speak. S311: the simulator wants a seeded PRNG, not a CSPRNG.
# E501: the formatter owns line length; what it leaves long is SQL and tabular literals, which read better whole.
ignore = ["S101", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# S608 flags SQL assembled from module-level constants. Every value in these files is a bind parameter.
"ghostfleet/sink.py" = ["S608"]
"ghostfleet/api.py" = ["S608"]

[tool.mypy]
files = ["ghostfleet"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a real PostGIS and Kafka (GHOST_TEST_DSN, GHOST_TEST_KAFKA)"]
