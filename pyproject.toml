[project]
name = "goldstandard"
version = "0.1.0"
description = "A consumer price index for a video game economy"
requires-python = ">=3.11,<3.13"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
pipeline = ["polars>=1.8", "duckdb>=1.1", "pyarrow>=17", "numpy>=1.26", "dagster>=1.8", "dagster-webserver>=1.8", "dagster-postgres>=0.24"]

[dependency-groups]
dev = [
    "goldstandard[api,pipeline]",
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5",
]

[project.scripts]
goldstandard = "goldstandard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldstandard"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
packages = ["goldstandard"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["goldstandard.defs"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL (DATABASE_URL)",
]
addopts = "-ra"

[tool.dagster]
module_name = "goldstandard.defs"
