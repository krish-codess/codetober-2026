name: wrapped
version: "1.0.0"
profile: wrapped
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  wrapped_year: "{{ env_var('WRAPPED_YEAR', '2025') }}"
  # An account with more events than this on any single UTC day is treated as automation (2 a minute, all day).
  automation_daily_events: 3000
  # Share-of-activity metrics (weekend share) are only computed for users with at least this many events.
  min_events_for_share_metrics: 20
  # No comparison is published unless at least this many users sit at or above the threshold behind it.
  k_anonymity: "{{ env_var('WRAPPED_K_ANONYMITY', '10') }}"

models:
  wrapped:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
