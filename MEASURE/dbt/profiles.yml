# Everything comes from the environment; `wrapped transform` sets these from its own settings.
wrapped:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('WRAPPED_WAREHOUSE_PATH') }}"
      threads: 1
      # Database-level options, applied once when the file is opened. (As per-cursor settings, dbt re-applies
      # them on every new cursor, and DuckDB refuses to change temp_directory once a query has spilled to it.)
      config_options:
        memory_limit: "{{ env_var('WRAPPED_DUCKDB_MEMORY', '1GB') }}"
        threads: "{{ env_var('WRAPPED_DUCKDB_THREADS', '4') | int }}"
        temp_directory: "{{ env_var('WRAPPED_DATA_DIR') }}/tmp"
        preserve_insertion_order: false
      settings:
        TimeZone: UTC
