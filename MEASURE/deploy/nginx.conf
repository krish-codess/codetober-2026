# The edge. In production this role is a CDN: static assets served from cache, share cards cached
# by their versioned URL, and only the small JSON API reaching the origin.

proxy_cache_path /tmp/card-cache levels=1:2 keys_zone=cards:10m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Hashed filenames: the content behind a URL never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell must always be fresh so a new deploy is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Rendered share cards: the URL carries the run version, so cache them at the edge and keep serving
    # them if the origin is down.
    location ~ ^/v1/shares/[A-Za-z0-9_-]+/card\.png$ {
        proxy_pass http://api:8000;
        proxy_cache cards;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~ ^/(v1|s)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
