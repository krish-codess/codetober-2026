[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapped"
version = "0.1.0"
description = "Your App, Wrapped: a year-in-review for every user, with percentile claims that are true by construction"
requires-python = ">=3.11"
# Pinned exactly: the committed measurements are only reproducible against these versions.
dependencies = [
  "duckdb==1.5.6",
  "dbt-core==1.12.5",
  "dbt-duckdb==1.11.0",
  "numpy==2.4.6",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "psycopg[binary,pool]==3.3.6",
  "alembic==1.20.0",
  "pillow==12.3.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10", "mypy==2.4.0"]

[project.scripts]
wrapped = "wrapped.cli:main"

[tool.setuptools]
packages = ["wrapped"]

[tool.setuptools.package-data]
wrapped = ["fonts/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S608"]
"migrations/*" = ["E501"]
# SQL here is assembled from module constants and validated config, never from request input.
"wrapped/generate.py" = ["S608", "E501"]
"wrapped/ingest.py" = ["S608"]
"wrapped/build.py" = ["S608"]
# Card copy reads better on one line than wrapped mid-sentence.
"wrapped/cards.py" = ["E501"]
# Route declarations and user-facing messages are kept on one line.
"wrapped/api.py" = ["E501"]
"wrapped/publish.py" = ["E501"]

[tool.mypy]
files = ["wrapped"]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a real PostgreSQL (WRAPPED_TEST_ADMIN_URL)"]
