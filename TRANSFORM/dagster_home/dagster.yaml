# Dagster instance config for containers: run/event/schedule storage in PostgreSQL.
storage:
  postgres:
    postgres_db:
      username: gs_pipeline
      password:
        env: DAGSTER_PG_PASSWORD
      hostname: postgres
      db_name: dagster
      port: 5432
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 2
telemetry:
  enabled: false
